name: Build & Release APK

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Increment Version
        run: |
          MAJOR=$(grep 'major=' version.properties | cut -d'=' -f2)
          MINOR=$(grep 'minor=' version.properties | cut -d'=' -f2)
          PATCH=$(grep 'patch=' version.properties | cut -d'=' -f2)
          BUILD=$(grep 'build=' version.properties | cut -d'=' -f2)
          BETA=$(grep 'beta_version=' version.properties | cut -d'=' -f2)
          
          NEW_BUILD=$((BUILD + 1))
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            NEW_PATCH=$((PATCH + 1))
            # 初回0.0.0リリース対応
            if [ "$PATCH" == "-1" ]; then
              NEW_PATCH=0
            fi
            sed -i "s/patch=.*/patch=$NEW_PATCH/" version.properties
            sed -i "s/beta_version=.*/beta_version=0/" version.properties
            sed -i "s/build=.*/build=$NEW_BUILD/" version.properties
            
            echo "NEW_VERSION=$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_ENV
            echo "VERSION_TAG=v$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release - v$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            NEW_BETA=$((BETA + 1))
            
            # devブランチでpatchが-1の場合は表示上0として扱う
            DISPLAY_PATCH=$PATCH
            if [ "$PATCH" == "-1" ]; then
              DISPLAY_PATCH=0
            fi
            
            sed -i "s/beta_version=.*/beta_version=$NEW_BETA/" version.properties
            sed -i "s/build=.*/build=$NEW_BUILD/" version.properties
            
            echo "NEW_VERSION=$MAJOR.$MINOR.$DISPLAY_PATCH-beta.$NEW_BETA" >> $GITHUB_ENV
            echo "VERSION_TAG=v$MAJOR.$MINOR.$DISPLAY_PATCH-beta.$NEW_BETA" >> $GITHUB_ENV
            echo "RELEASE_NAME=Pre release - v$MAJOR.$MINOR.$DISPLAY_PATCH-beta.$NEW_BETA" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.keystore
          else
            echo "No keystore provided, skipping decode"
          fi

      - name: Build and Sign APK
        env:
          RELEASE_KEYSTORE_FILE: release-key.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.properties
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: app/build/outputs/apk/release/nitkc-ryousyoku-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
